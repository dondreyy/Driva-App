<title>Driva Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Concept: a night drive across Lagos. Deep navy for trust, amber used only where the user acts or money moves. Warm paper for forms, a stylized city map for every trip moment. */
:root{
  --navy:#0B2545; --amber:#F5A524; --amber-soft:#FFF3D6;
  --bg:#F7F4EE; --surface:#FFFFFF; --ink:#0B2545; --muted:#5A6A82; --line:#E7E1D4; --soft:#EFEADF;
  --ok:#16794A; --okbg:#DFF2E6; --warn:#B3261E; --warnbg:#FBE4E1;
  --outer:#DDE3EC; --chip-on-bg:#0B2545; --chip-on-ink:#FFFFFF; --shadow:rgba(11,37,69,.16);
  --m-land:#FFFFFF; --m-block:#EEE8DA; --m-water:#BFD8EC; --m-park:#D3E5CC; --m-avenue:#FBE9BE; --m-route:#0B2545; --m-casing:#FFFFFF; --m-label:#5A6A82;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07152A; --surface:#0F2440; --ink:#EEF3FA; --muted:#9BB0CC; --line:#1F3B65; --soft:#14294A;
    --ok:#6FD6A0; --okbg:#10382A; --warn:#FF8A80; --warnbg:#3A1C1C; --amber-soft:#2E2A18;
    --outer:#030B17; --chip-on-bg:#F5A524; --chip-on-ink:#0B2545; --shadow:rgba(0,0,0,.5);
    --m-land:#0B1D38; --m-block:#10294D; --m-water:#0A3558; --m-park:#0F3B35; --m-avenue:#2B3B52; --m-route:#F5A524; --m-casing:#07152A; --m-label:#9BB0CC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07152A; --surface:#0F2440; --ink:#EEF3FA; --muted:#9BB0CC; --line:#1F3B65; --soft:#14294A;
  --ok:#6FD6A0; --okbg:#10382A; --warn:#FF8A80; --warnbg:#3A1C1C; --amber-soft:#2E2A18;
  --outer:#030B17; --chip-on-bg:#F5A524; --chip-on-ink:#0B2545; --shadow:rgba(0,0,0,.5);
  --m-land:#0B1D38; --m-block:#10294D; --m-water:#0A3558; --m-park:#0F3B35; --m-avenue:#2B3B52; --m-route:#F5A524; --m-casing:#07152A; --m-label:#9BB0CC;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3,.head{font-family:var(--head);letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:420px;height:100%;max-height:860px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative;border-radius:30px;box-shadow:0 24px 60px var(--shadow);border:6px solid var(--navy)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--navy);color:#fff;font-size:12px;flex:none}
.pseg{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:2px}
.pseg button{border:0;background:transparent;color:#fff;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700}
.pseg button[aria-pressed="true"]{background:var(--amber);color:var(--navy)}
.view{flex:1;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.toast{position:absolute;left:16px;right:16px;bottom:18px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;z-index:20;box-shadow:0 8px 24px var(--shadow)}
.toast[hidden]{display:none}

/* motion: only when the screen or stage changed */
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes stageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ripple{0%{transform:scale(.2);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,165,36,.5)}100%{box-shadow:0 0 0 22px rgba(245,165,36,0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes tick{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes drive{from{transform:translateX(-80px)}to{transform:translateX(470px)}}
@keyframes lane{to{stroke-dashoffset:-24}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes count{from{stroke-dashoffset:0}to{stroke-dashoffset:1}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
[data-animate="screen"] .screen{animation:scrIn .35s cubic-bezier(.2,.8,.2,1) both}
[data-animate="screen"] .sheet{animation:sheetUp .5s cubic-bezier(.2,.8,.2,1) both}
[data-animate="stage"] .stagebody,[data-animate="screen"] .stagebody{animation:stageIn .4s cubic-bezier(.2,.8,.2,1) both}
.route{stroke-dasharray:1;stroke-dashoffset:0}
[data-animate="screen"] .route{animation:draw 1.3s ease-out both}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
.tickpath{stroke-dasharray:30;animation:tick .5s .2s ease-out both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* buttons and inputs */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:16px 18px;font-family:var(--head);font-weight:800;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--amber);color:var(--navy)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.split{justify-content:space-between}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{width:auto;padding:10px 14px;font-size:14px;border-radius:14px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.link{border:0;background:none;color:var(--muted);font-weight:700;padding:6px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 15px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:var(--chip-on-bg);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.label{font-family:var(--head);font-weight:800;font-size:15px;margin:20px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row+.row{margin-top:10px}
.divider{height:1px;background:var(--line);margin:14px 0}
.vet{display:inline-flex;align-items:center;gap:5px;background:var(--okbg);color:var(--ok);border-radius:999px;padding:3px 10px 3px 7px;font-size:12px;font-weight:700}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700}
.starfill{color:var(--amber);fill:currentColor;vertical-align:-2px}

/* sheet over map */
.mapbox{position:absolute;left:0;right:0;top:0;height:54%;overflow:hidden;background:var(--m-land)}
.mapbox svg{width:100%;height:100%;display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px var(--shadow);padding:10px 20px 20px;max-height:68%;overflow-y:auto;overscroll-behavior:contain}
.sheet.tall{top:26%;max-height:none}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.fab{position:absolute;top:14px;left:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 4px 14px var(--shadow);display:grid;place-items:center}
.demo{position:absolute;top:14px;right:14px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.demo button{border:0;background:rgba(11,37,69,.88);color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.alertbar{position:absolute;left:14px;right:14px;top:70px;z-index:5;background:var(--warnbg);color:var(--warn);border:1.5px solid var(--warn);border-radius:16px;padding:12px 14px;font-size:14px}
.alertbar b{display:block;font-family:var(--head)}

/* map classes */
.m-land{fill:var(--m-land)}.m-blocks{fill:var(--m-block)}.m-water{fill:var(--m-water)}.m-park{fill:var(--m-park)}
.m-ave{stroke:var(--m-avenue);fill:none;stroke-linecap:round}
.m-case{stroke:var(--m-casing);fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-route{stroke:var(--m-route);fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-approach{fill:none;stroke:var(--m-route);stroke-opacity:.35;stroke-width:4;stroke-dasharray:2 7;stroke-linecap:round}
.m-lbl{font:700 11px var(--body);fill:var(--m-label)}
.m-pickup{fill:var(--navy);stroke:#fff;stroke-width:3}
.m-dest{fill:var(--amber);stroke:var(--navy);stroke-width:2.5}
.m-car-body{fill:var(--amber);stroke:var(--navy);stroke-width:2}
.m-car-win{fill:var(--navy)}
.ring-r{fill:none;stroke:var(--amber);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ripple 2.4s ease-out infinite}
.ring-r:nth-child(2){animation-delay:.8s}.ring-r:nth-child(3){animation-delay:1.6s}

/* welcome */
.hero{position:relative;flex:1;min-height:0;background:linear-gradient(180deg,#0B2545 0%,#12386B 100%);color:#fff;overflow:hidden}
.hero-svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:50%}
.hero-copy{position:relative;padding:22px 22px 0}
.hero h1{font-size:clamp(30px,9vw,40px);line-height:1.04;font-weight:800;margin-top:26px}
.hero p{margin-top:12px;color:#C5D2E6;max-width:30ch}
.win{animation:twinkle 4s ease-in-out infinite}
.drive{animation:drive 9s linear infinite}
.lane{animation:lane 1s linear infinite}
.brand{display:flex;align-items:center;gap:10px}
.brand .word{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.02em}
.wcard{position:relative;margin-top:-26px;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 20px 22px;flex:none}
.trust{display:flex;gap:6px;margin-bottom:16px}
.trust span{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:700;padding:10px 4px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.trust svg{color:var(--ok)}

/* booking */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:14px}
.tcard b{font-family:var(--head);font-size:16px}
.tcard small{color:var(--muted);line-height:1.3}
.tcard .tc-ic{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;margin-bottom:4px}
.tcard[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 3px rgba(245,165,36,.25)}
.tcard[aria-pressed="true"] .tc-ic{background:var(--amber);color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid transparent;background:var(--bg);border-radius:16px;padding:11px 12px;text-align:left;width:100%}
.opt .ro-ic{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.opt .ro-t{flex:1;min-width:0;display:flex;flex-direction:column}
.opt .ro-t b{font-weight:700}
.opt .ro-t small{color:var(--muted)}
.opt .ro-r{color:var(--muted);font-size:13px}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--surface)}
.opt[aria-pressed="true"] .radio{border-color:var(--amber);background:var(--amber);box-shadow:inset 0 0 0 4px var(--amber-soft)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;line-height:1}
.ctabar{position:sticky;bottom:-20px;margin:18px -20px -20px;padding:14px 20px 20px;background:linear-gradient(180deg,rgba(255,255,255,0),var(--surface) 30%)}
:root[data-theme="dark"] .ctabar{background:linear-gradient(180deg,rgba(15,36,64,0),var(--surface) 30%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ctabar{background:linear-gradient(180deg,rgba(15,36,64,0),var(--surface) 30%)}}

/* quote */
.fare{font-family:var(--head);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.lockrow{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:700;font-size:13px}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check-row .ic{flex:none;width:24px;height:24px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center}
.check-row+.check-row{margin-top:10px}

/* finding */
.fsteps{list-style:none;margin:16px 0 4px;padding:0;display:flex;flex-direction:column;gap:14px}
.fsteps li{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:500}
.fsteps .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.fsteps li.now{color:var(--ink);font-weight:700}
.fsteps li.now .dot{border-color:var(--amber);animation:pulse 1.2s ease-out infinite}
.fsteps li.done{color:var(--ink)}
.fsteps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.skel{height:78px;border-radius:20px;background:linear-gradient(90deg,var(--soft) 25%,var(--bg) 50%,var(--soft) 75%);background-size:400px 100%;animation:shimmer 1.2s linear infinite}

/* trip */
.drv{display:flex;align-items:center;gap:12px}
.drv-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.drv-t b{font-family:var(--head);font-size:17px}
.drv-t .vet{align-self:flex-start}
.drv-a{display:flex;gap:8px}
.av{flex:none;width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--amber)}
.eta-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eta-big{font-family:var(--head);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em}
.tl{list-style:none;display:flex;margin:0 0 16px;padding:0}
.tl li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);position:relative;font-weight:500}
.tl li i{width:12px;height:12px;border-radius:50%;background:var(--line);position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;top:5px;left:calc(50% + 8px);right:calc(-50% + 8px);height:2px;background:var(--line)}
.tl li.done i,.tl li.now i{background:var(--amber)}
.tl li.done:not(:last-child)::after{background:var(--amber)}
.tl li.now{color:var(--ink);font-weight:700}
.tl li.now i{box-shadow:0 0 0 5px rgba(245,165,36,.3)}
.pinbox{background:var(--navy);color:#fff;border-radius:22px;padding:16px;margin:0 0 14px;text-align:center}
.pinbox .digs{display:flex;gap:10px;justify-content:center;margin:10px 0 8px}
.pindig{width:52px;height:64px;border-radius:14px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:32px}
.pinbox small{color:#C5D2E6}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{border:1.5px dashed var(--line);background:var(--bg);border-radius:16px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.photo[aria-pressed="true"]{border:1.5px solid var(--ok);background:var(--okbg);color:var(--ok)}
.safety{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* receipt and success */
.success{width:84px;height:84px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:var(--amber)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:22px 20px 24px}

/* driver */
.dtop{background:var(--navy);color:#fff;padding:18px 20px 40px;flex:none}
.dbody{position:relative;margin-top:-22px;background:var(--bg);border-radius:26px 26px 0 0;padding:20px;flex:1;min-height:0;overflow-y:auto}
.toggle{display:flex;align-items:center;gap:10px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 8px 6px 14px;font-weight:700;font-size:13px}
.toggle i{width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.3);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--ok)}
.toggle[aria-pressed="true"] i::after{transform:translateX(18px)}
.earn{font-family:var(--head);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-family:var(--head);font-size:18px}
.stats span{font-size:12px;color:#C5D2E6}
.req{border:2px solid var(--amber);background:var(--surface);border-radius:24px;padding:16px}
.cd{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center;font-family:var(--head);font-weight:800}
.cd svg{position:absolute;inset:0}
.ringfg{stroke-dasharray:1;animation:count 30s linear forwards}
.miniroute{background:var(--bg);border-radius:14px;overflow:hidden;margin:12px 0}
.empty{text-align:center;padding:30px 10px}
.empty .moon{width:88px;height:88px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:13px;font-family:var(--head);font-weight:800;font-size:22px}
.pad button:active{background:var(--soft)}
.pinrow{display:flex;gap:10px;justify-content:center}
.pinrow .pindig{background:var(--bg);border-color:var(--line);color:var(--ink)}
.pinrow.bad{animation:shake .4s}
.pinrow.ok .pindig{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
/* forms and accounts */
.fhead{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;flex:none;min-height:64px}
.prog{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--amber);border-radius:6px;transition:width .3s}
.fbody{flex:1;min-height:0;overflow-y:auto;padding:10px 20px 20px;overscroll-behavior:contain}
.ffoot{flex:none;padding:12px 20px 18px;background:var(--bg);border-top:1px solid var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px}
.field input:focus{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--navy)}

}

    h+='<g id="car" data-mode="'+o.car+'"><circle r="17" fill="#000" opacity=".12"/><rect class="m-car-body" x="-8" y="-13" width="16" height="26" rx="6"/><rect class="m-car-win" x="-5.5" y="-6" width="11" height="8" rx="2.5" opacity=".85"/></g>';
  }
  return h+'</svg>';
}
var raf=0;
function placeCar(path,p,car){
  var L=path.getTotalLength();
  var a=path.getPointAtLength(Math.max(0,Math.min(L,p*L)));
  var b=path.getPointAtLength(Math.min(L,p*L+3));
  var ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+90;
  car.setAttribute("transform","translate("+a.x+" "+a.y+") rotate("+ang+")");
}
function animateCar(){
  var car=$("#car"); if(!car) return;
  var mode=car.dataset.mode;
  var path=$(mode==="approach"?"#approach":"#route"); if(!path) return;
  var start=mode==="approach"?S.apStart:S.tripStart, dur=mode==="approach"?11000:26000, total=mode==="approach"?6:16;
  var still=(S.role==="client"?S.stage:S.d.stage)===1;
  (function step(){
    var p=still?1:Math.min(1,(performance.now()-start)/dur);
    if(reduce&&!still) p=0.6;
    placeCar(path,p,car);
    var eta=$("#eta");
    if(eta) eta.textContent=Math.max(1,Math.ceil((1-p)*total))+" min";
    if(p<1&&!reduce&&!still) raf=requestAnimationFrame(step);
  })();
}

function skyline(){
  var s="";
  for(var i=0;i<14;i++){
    var x=i*30-8,w=26+((i*7)%10),h=60+((i*53)%110);
    s+='<rect x="'+x+'" y="'+(300-h)+'" width="'+w+'" height="'+h+'" fill="#FFFFFF" fill-opacity="'+(0.05+(i%3)*0.02)+'"/>';
    for(var r=0;r<Math.floor(h/16);r++)for(var c=0;c<2;c++){
      if(((i*3+r*5+c*7)%4)===0) s+='<rect class="win" style="animation-delay:'+((i+r+c)%5)+'s" x="'+(x+6+c*(w/2-2))+'" y="'+(300-h+8+r*16)+'" width="4" height="6" rx="1" fill="#F5A524" fill-opacity=".85"/>';
    }
  }
  return s;
}

  var rows=S.trips.map(function(t){var w=t.who||tm[(t.w||0)%tm.length].n;return '<div class="row"><div style="min-width:0"><b>'+esc(t.r)+'</b><div class="muted small">'+esc(t.d)+' &middot; '+esc(w)+' &middot; '+t.t+'</div></div><span class="num">'+fmt(t.a)+'</span></div>'}).join("");
  return '<div class="screen"><div class="dtop"><div class="row"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button type="button" class="icon-btn" style="background:rgba(255,255,255,.14);border-color:transparent;color:#fff" data-act="go" data-arg="welcome" aria-label="Back">'+ic("back",20)+'</button><b class="head" style="font-size:18px">'+esc(b.name)+'</b></div><span class="vet" style="background:rgba(255,255,255,.14);color:#FFC857;flex:none">'+ic("clock",13)+' Check in progress</span></div>'+
  '<div class="earn num">'+fmt(spend())+'</div><div style="color:#C5D2E6;font-size:13px">October spend</div>'+
  '<div class="stats"><div><b>'+S.trips.length+'</b><span>Trips</span></div><div><b>'+tm.length+'</b><span>People</span></div><div><b>'+(b.bill==="wallet"?"Wallet":"Invoice")+'</b><span>Billing</span></div></div></div>'+
  '<div class="dbody"><div class="stagebody"><button type="button" class="btn primary" data-act="bookBiz">Book a driver for the team</button>'+
  '<div class="label">Recent trips</div><p class="muted small" style="margin:-6px 0 10px">Sample data for this preview.</p><div class="card">'+rows+'</div>'+
  '<div class="label">Team</div>'+teamList()+addTeamForm()+
  '<div class="label">Account rules</div><div class="card"><div class="row"><span class="muted">Billing</span><span>'+(b.bill==="wallet"?"Pay per trip":"Monthly invoice")+'</span></div><div class="row"><span class="muted">Trip approval</span><span>'+(b.approve?"Required":"Not required")+'</span></div><div class="row"><span class="muted">Limit per person</span><span class="num">'+esc(b.limit)+'</span></div></div>'+
  '<div style="height:14px"></div><button type="button" class="btn ghost" data-act="toast" data-arg="The October invoice would download here as a PDF.">Download October invoice</button></div></div></div>';
}

function dReg(){
  var dd=S.d, s=dd.rs, fill=["fill",null,"Fill with sample details"];
  if(s===0){
    var L=["Your NIN and a valid driving licence","A passport photograph and a selfie","Two guarantors who agree to a home visit","A home visit by a VeriQuest officer"];
    return form({total:0,back:["dBack"],title:"Drive with Driva",sub:"Choose your hours. Keep 85% of every fare for your first 12 months.",
      body:'<div class="card"><b class="head">What you will need</b><div style="height:12px"></div>'+L.map(function(t){return '<div class="check-row"><span class="ic">'+ic("check",14)+'</span><span>'+t+'</span></div>'}).join("")+'</div><p class="muted small" style="margin-top:12px">Vetting is free for founding drivers.</p>',
      cta:["dNext",null,"Start registration"]});
  }
  if(s===1) return form({step:1,total:4,back:["dBack"],title:"About you",sub:"These must match your ID.",
    body:field("dn","Full name")+field("dp","Phone number",{t:"tel",m:"tel"})+field("nin","NIN",{m:"numeric",max:11,ph:"11 digits"})+field("lic","Driving licence number")+'<div class="label" style="margin-top:4px">Years of driving</div>'+picks("exp",["Under 3 years","4 to 7 years","8 years or more"]),
    cta:["dNext",null,"Continue"],alt:fill});
  if(s===2) return form({step:2,total:4,back:["dBack"],title:"Your documents",sub:"Clear photos of the original documents.",
    body:'<div class="photos">'+[["doc0","Licence"],["doc1","NIN"],["doc2","Passport"]].map(function(x){return '<button type="button" class="photo" data-act="tog" data-arg="'+x[0]+'" aria-pressed="'+!!V[x[0]]+'">'+ic(V[x[0]]?"check":"camera",24)+x[1]+'</button>'}).join("")+'</div><p class="muted small" style="margin-top:10px">Tap a tile to simulate an upload.</p>',
    cta:["dNext",null,"Continue"]});
  if(s===3){
    var g=function(n,t){return '<div class="gcard"><b class="head">'+t+'</b><div style="height:10px"></div>'+field(n+"n","Full name")+field(n+"p","Phone number",{t:"tel",m:"tel"})+field(n+"r","Relationship and occupation")+field(n+"a","Home address")+'</div>'};
    return form({step:3,total:4,back:["dBack"],title:"Home and guarantors",sub:"A VeriQuest officer visits you and each guarantor in person. A guarantor is a working adult who has known you for at least 2 years, lives in Lagos and agrees to the visit.",
      body:field("ha","Your home address")+g("g1","Guarantor 1")+g("g2","Guarantor 2"),cta:["dNext",null,"Continue"],alt:fill});
  }
  if(s===4) return form({step:4,total:4,back:["dBack"],title:"Consent and selfie",sub:"We need your permission to run the checks.",
    body:tgl("c1","I agree to a home visit","A VeriQuest officer will confirm where I live.")+tgl("c2","I agree to my guarantors being visited","Each guarantor is visited at home.")+tgl("c3","I agree to ID and criminal record checks","Checked against NIN, licence and police records.")+
      '<div class="label">Selfie</div><div class="photos" style="grid-template-columns:1fr"><button type="button" class="photo" data-act="tog" data-arg="selfie" aria-pressed="'+!!V.selfie+'">'+ic(V.selfie?"check":"camera",24)+'Take a selfie</button></div>',
    cta:["dNext",null,"Submit application"]});
  var vet=dd.vet, ok=vet>=6;
  return form({total:0,back:["backToWelcome"],title:ok?"You are approved":"Vetting in progress",sub:ok?"You can go online and accept trips.":"VeriQuest will call "+esc(first(V.dn||"you"))+" to book your home visit.",
    body:steps(["Application received","Documents checked","Home visit","Guarantor visits","Criminal record check","Approved"],vet),
    cta:ok?["dHomeGo",null,"Go to driver home"]:["dMove",null,"Move vetting forward (prototype)"]});
}

/* ---------- render ---------- */
var lastScreen="", lastStage="", findTs=[], cdInt=0;
function render(){
  cancelAnimationFrame(raf);
  var isC=S.role==="client", dd=S.d;
  var screenKey=S.role+"|"+(isC?S.screen:dd.screen);
  var stageKey=screenKey+"|"+(isC?S.stage+"|"+S.find+"|"+S.su.step+"|"+S.su.kind:dd.stage+"|"+dd.online+"|"+dd.req+"|"+dd.rs);
  var anim=screenKey!==lastScreen?"screen":(stageKey!==lastStage?"stage":"none");
  lastScreen=screenKey; lastStage=stageKey;
  var v=$("#view"), oldSheet=$(".sheet",v)||$(".scroll",v)||$(".dbody",v)||$(".fbody",v), sc=oldSheet?oldSheet.scrollTop:0;
  v.dataset.animate=anim;
  var h="";
  if(isC) h=({welcome:welcome,book:bookScreen,quote:quoteScreen,finding:findingScreen,trip:tripScreen,receipt:receiptScreen,signup:signupScreen,biz:bizScreen})[S.screen]();
  else h=({home:dHome,trip:dTrip,summary:dSummary,reg:dReg})[dd.screen]();
  v.innerHTML=h;
  if(anim!=="screen"&&sc){var ns=$(".sheet",v)||$(".scroll",v)||$(".dbody",v)||$(".fbody",v); if(ns) ns.scrollTop=sc}
  $("#rc").setAttribute("aria-pressed",isC); $("#rd").setAttribute("aria-pressed",!isC);
  animateCar();
  syncRequestTimer();
  if(anim==="screen"&&!isC&&dd.screen==="home") countUp();
}
function countUp(){
  var el=$("#earn"); if(!el||reduce) return;
  var to=+el.dataset.to, t0=performance.now();
  (function s(){var p=Math.min(1,(performance.now()-t0)/900);el.textContent=fmt(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})();
}
function syncRequestTimer(){
  var live=S.role==="driver"&&S.d.screen==="home"&&S.d.online&&S.d.req==="new";
  if(live){
    if(!reqStart) reqStart=Date.now();
    if(!cdInt) cdInt=setInterval(function(){
      var left=30-Math.floor((Date.now()-reqStart)/1000);
      var el=$("#cd"); if(el) el.textContent=Math.max(0,left);
      if(left<=0){S.d.req="expired";clearInterval(cdInt);cdInt=0;reqStart=0;render()}
    },1000);
  } else { clearInterval(cdInt);cdInt=0; if(!(S.role==="driver"&&S.d.screen==="home"&&S.d.online&&S.d.req==="new")) reqStart=0; }
}
function clearFind(){findTs.forEach(clearTimeout);findTs=[]}
function startFind(){
  clearFind(); S.screen="finding"; S.find=0; render();
  [1,2,3].forEach(function(n,i){findTs.push(setTimeout(function(){
    if(S.screen!=="finding") return;
    S.find=n;
    if(n===3){S.screen="trip";S.stage=0;S.photos=[0,0,0,0,0];S.alert=0;S.apStart=performance.now()}
    render();
  },(i+1)*(reduce?300:1000)))});
}

var A={
  openSignup:function(){S.su={kind:"",step:0};S.screen="signup";render()},
  signup:function(v){if(v==="driver"){A.regDriver();return}S.su.kind=v;S.su.step=1;render()},
  suBack:function(){var su=S.su;if(su.step<=0){S.screen="welcome"}else if(su.step===1){su.step=0;su.kind=""}else{su.step--}render()},
  suNext:function(){
    var su=S.su,k=su.kind,s=su.step;
    if(k==="personal"){
      if(s===1){if(!need([["pn","Enter your full name."],["pp","Enter your phone number."]]))return;su.step=2}
      else if(s===2){if(!/^\d{4}$/.test(V.code||"")){toast("Enter the 4 digit code.");return}su.step=3;S.acct="personal"}
    } else if(k==="business"){
      if(s===1){
        if(!need([["cname","Enter the company name."],["rc","Enter the RC number."],["cn","Enter the contact person."],["ce","Enter a work email."]]))return;
        if(String(V.ce).indexOf("@")<1){toast("Enter a valid work email.");return}
        if(!V.ind){toast("Choose the industry.");return}
        su.step=2;
      } else if(s===2){su.step=3}
      else if(s===3){
        if(!V.cac||!V.dir){toast("Add both documents.");return}
        S.biz={name:V.cname.trim(),cn:V.cn.trim(),bill:V.bill||"invoice",approve:!!V.approve,limit:V.limit||"No limit"};
        S.acct="business";S.who=0;su.step=4;
      }
    }
    render();
  },
  fill:function(){for(var k in SAMPLE)V[k]=SAMPLE[k];render()},
  pick:function(v){var i=v.indexOf(":");V[v.slice(0,i)]=v.slice(i+1);render()},
  tog:function(v){V[v]=!V[v];render()},
  addMember:function(){if(!need([["tn","Enter the team member name."]]))return;S.extra.push({n:V.tn.trim(),r:(V.tp||"").trim()||"Staff"});V.tn="";V.tp="";render()},
  acct:function(v){S.acct=v;S.who=0;render()},
  who:function(v){S.who=+v;render()},
  bookBiz:function(){S.acct="business";S.screen="book";render()},
  regDriver:function(){S.role="driver";S.d.screen="reg";S.d.rs=0;S.d.vet=1;render()},
  backToWelcome:function(){S.role="client";S.screen="welcome";S.d.screen="home";render()},
  dBack:function(){var d=S.d;if(d.rs<=0){A.backToWelcome();return}d.rs--;render()},
  dNext:function(){
    var d=S.d,s=d.rs;
    if(s===1){
      if(!need([["dn","Enter your full name."],["dp","Enter your phone number."],["nin","Enter your NIN."],["lic","Enter your licence number."]]))return;
      if(!/^\d{11}$/.test(String(V.nin).replace(/\s/g,""))){toast("A NIN has 11 digits.");return}
      if(!V.exp){toast("Choose your years of driving.");return}
    } else if(s===2){
      if(!(V.doc0&&V.doc1&&V.doc2)){toast("Add all three documents.");return}
    } else if(s===3){
      if(!need([["ha","Enter your home address."],["g1n","Enter guarantor 1 name."],["g1p","Enter guarantor 1 phone."],["g1r","Enter guarantor 1 relationship."],["g1a","Enter guarantor 1 address."],["g2n","Enter guarantor 2 name."],["g2p","Enter guarantor 2 phone."],["g2r","Enter guarantor 2 relationship."],["g2a","Enter guarantor 2 address."]]))return;
      if(String(V.g1p).replace(/\s/g,"")===String(V.g2p).replace(/\s/g,"")){toast("Use two different guarantors.");return}
    } else if(s===4){
      if(!(V.c1&&V.c2&&V.c3)){toast("Agree to all three checks to continue.");return}
      if(!V.selfie){toast("Take a selfie to continue.");return}
      d.vet=1;
    }
    d.rs=s+1;render();
  },
  dMove:function(){if(S.d.vet<6)S.d.vet++;render()},
  dHomeGo:function(){S.d.screen="home";S.d.req="new";reqStart=0;render()},
  role:function(v){clearFind();S.role=v;if(v==="client"&&S.screen==="finding")S.screen="welcome";render()},
  go:function(v){S.screen=v;render()},
  type:function(v){S.type=v;render()},
  dest:function(v){S.dest=+v;render()},
  hours:function(v){S.hours=Math.min(12,Math.max(2,S.hours+ +v));render()},
  when:function(v){S.when=+v;render()},
  car:function(v){S.car=+v;render()},
  task:function(v){S.task=+v;render()},
  request:function(){startFind()},
  cancel:function(){clearFind();S.screen="quote";render()},
  photo:function(v){S.photos[+v]=S.photos[+v]?0:1;render()},
  handover:function(){S.stage=2;S.tripStart=performance.now();render()},
  next:function(){
    if(S.stage===0){S.stage=1}
    else if(S.stage===1){S.photos=[1,1,1,1,1];S.stage=2;S.tripStart=performance.now()}
    else {S.screen="receipt";S.alert=0}
    render();
  },
  alert:function(){S.alert=1;render()},
  clearAlert:function(){S.alert=0;render()},
  rate:function(v){S.rating=+v;render()},
  tag:function(v){S.tag[v]=!S.tag[v];render()},
  tip:function(v){S.tip=+v;render()},
  done:function(){if(S.acct==="business"&&S.biz){S.trips.unshift({d:"Today",who:whoName(),r:"Lekki Phase 1 to "+PLACES[S.dest].n,t:typeLabel(),a:quote().total+S.tip})}S.screen="welcome";S.stage=0;S.rating=0;S.tip=0;S.tag={};render()},
  toast:function(v){toast(v)},
  online:function(){S.d.online=!S.d.online;if(S.d.online)S.d.req="new";reqStart=0;render()},
  decline:function(){S.d.req="declined";reqStart=0;render()},
  newreq:function(){S.d.req="new";reqStart=0;render()},
  accept:function(){var d=S.d;d.screen="trip";d.stage=0;d.pin="";d.pinOk=false;d.bad=0;d.photos=[0,0,0,0,0];S.apStart=performance.now();reqStart=0;render()},
  dArrive:function(){S.d.stage=1;render()},
  key:function(v){
    var d=S.d; if(d.pinOk) return;
    d.bad=0;
    if(v==="back") d.pin=d.pin.slice(0,-1);
    else if(d.pin.length<4) d.pin+=v;
    if(d.pin.length===4){
      if(d.pin===PIN){d.pinOk=true;toast("PIN confirmed")}
      else {d.bad=1;d.pin="";toast("That PIN does not match. Ask the client again.")}
    }
    render();
  },
  dPhoto:function(v){S.d.photos[+v]=S.d.photos[+v]?0:1;render()},
  dStart:function(){S.d.stage=2;S.tripStart=performance.now();render()},
  dEnd:function(){S.d.screen="summary";render()},
  dRate:function(v){S.d.rating=+v;render()},
  dDone:function(){var d=S.d;d.screen="home";d.stage=0;d.rating=0;d.req="new";reqStart=0;render()}
};
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el||el.disabled) return;
  var f=A[el.dataset.act]; if(f) f(el.dataset.arg);
});
document.addEventListener("input",function(e){var n=e.target&&e.target.name;if(n)V[n]=e.target.value});
render();
})();
</script>
